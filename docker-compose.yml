services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: music_atlas
      POSTGRES_USER: music_atlas
      POSTGRES_PASSWORD: music_atlas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_atlas -d music_atlas"]
      interval: 5s
      timeout: 5s
      retries: 5
